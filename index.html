<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintarku - Belajar & Ujian Jadi Lebih Menyenangkan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6d4c41; /* Brown */
            --secondary: #a1887f; /* Lighter Brown */
            --accent: #ffab40; /* Amber */
            --background: #efebe9; /* Brownish White */
            --text-primary: #3e2723; /* Dark Brown */
            --text-secondary: #5d4037;
            --surface: #ffffff;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        .bg-primary { background-color: var(--primary); }
        .bg-secondary { background-color: var(--secondary); }
        .bg-accent { background-color: var(--accent); }
        .bg-surface { background-color: var(--surface); }
        .text-primary { color: var(--primary); }
        .text-accent { color: var(--accent); }
        .border-primary { border-color: var(--primary); }
        .border-secondary { border-color: var(--secondary); }

        .btn {
            @apply font-bold py-2 px-4 rounded-lg shadow-md transition-all duration-300 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:scale-100;
        }

        .btn-primary {
            @apply bg-primary text-white hover:bg-opacity-90;
        }

        .btn-outline {
            @apply bg-transparent border border-primary text-primary hover:bg-primary hover:text-white;
        }

        .input-field {
            @apply w-full px-4 py-2 border border-secondary rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary transition-colors duration-300;
        }

        .card {
            @apply bg-surface rounded-xl shadow-lg overflow-hidden p-6 transition-transform duration-300 hover:shadow-xl hover:-translate-y-1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        #splash-screen {
            z-index: 100;
        }

        .welcome-text {
            animation: fadeIn 1s ease-out 0.5s forwards, fadeOut 1s ease-in 2.5s forwards;
            opacity: 0;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--background);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .ProseMirror {
            @apply p-4 border border-gray-300 rounded-lg min-h-[200px] focus:outline-none focus:ring-2 focus:ring-primary;
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-primary flex flex-col items-center justify-center transition-opacity duration-1000 ease-in-out">
        <div class="text-center text-white">
            <svg class="w-24 h-24 mx-auto mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v11.494m-5.22-6.22l5.22 6.22 5.22-6.22M3 10.5a9 9 0 1118 0c0 2.485-1.19 4.75-3.1 6.25"></path></svg>
            <h1 class="font-poppins text-4xl font-bold welcome-text">Selamat Datang di Pintarku</h1>
            <p class="mt-2 text-lg welcome-text">Belajar dan Ujian Jadi Lebih Menyenangkan!</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app" class="hidden">
        <!-- Login Page -->
        <div id="login-page" class="min-h-screen flex items-center justify-center bg-background px-4">
            <div class="w-full max-w-md card fade-in">
                <div class="text-center">
                    <svg class="w-16 h-16 mx-auto text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v11.494m-5.22-6.22l5.22 6.22 5.22-6.22M3 10.5a9 9 0 1118 0c0 2.485-1.19 4.75-3.1 6.25"></path></svg>
                    <h2 class="font-poppins text-3xl font-bold mt-4">Login ke Pintarku</h2>
                    <p class="text-text-secondary mt-2">Silakan pilih peran dan masukkan kredensial Anda.</p>
                </div>
                <form id="login-form" class="mt-8 space-y-6">
                    <div>
                        <label for="role-select" class="block text-sm font-bold text-text-secondary">Masuk sebagai:</label>
                        <select id="role-select" class="input-field mt-1">
                            <option value="siswa">Siswa</option>
                            <option value="guru">Guru</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div id="username-container">
                        <label for="username" id="username-label" class="block text-sm font-bold text-text-secondary">Username</label>
                        <input type="text" id="username" class="input-field mt-1" required>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-bold text-text-secondary">Password</label>
                        <input type="password" id="password" class="input-field mt-1" required>
                    </div>
                    <p id="login-error" class="text-red-500 text-sm hidden">Login gagal. Periksa kembali data Anda.</p>
                    <button type="submit" class="w-full btn btn-primary">Login</button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="relative min-h-screen lg:flex">
                <!-- Sidebar -->
                <aside id="sidebar" class="fixed top-0 left-0 h-full z-30 w-64 bg-primary text-white flex-shrink-0 transition-transform duration-300 ease-in-out -translate-x-full">
                    <div class="p-4 text-center border-b border-white/20">
                        <h1 class="font-poppins text-2xl font-bold">Pintarku</h1>
                    </div>
                    <nav class="mt-4">
                        <a href="#" data-page="home" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                            <i data-lucide="home"></i><span class="ml-3">Beranda</span>
                        </a>
                        <a href="#" data-page="belajar" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                            <i data-lucide="book-open"></i><span class="ml-3">Belajar Yuk</span>
                        </a>
                        <a href="#" data-page="uji" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="file-check-2"></i><span class="ml-3">Uji Aja</span>
                        </a>
                        <a href="#" data-page="ask-admin" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="message-square"></i><span class="ml-3">Ask Admin</span>
                        </a>
                        <a href="#" data-page="panduan" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="help-circle"></i><span class="ml-3">Tata Cara</span>
                        </a>
                        <a href="#" data-page="profil" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="user"></i><span class="ml-3">Profil</span>
                        </a>
                        <!-- Admin Only Menu -->
                        <div id="admin-menu" class="hidden">
                             <hr class="my-2 border-white/20">
                            <a href="#" data-page="user-management" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                               <i data-lucide="users"></i><span class="ml-3">Manajemen User</span>
                            </a>
                            <a href="#" data-page="activity-log" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                               <i data-lucide="activity"></i><span class="ml-3">Log Aktivitas</span>
                            </a>
                        </div>
                    </nav>
                     <div class="absolute bottom-4 left-4 right-4">
                        <button id="logout-btn" class="w-full flex items-center justify-center px-4 py-2 bg-red-500 hover:bg-red-600 transition-colors duration-200 rounded-lg">
                            <i data-lucide="log-out" class="mr-2"></i><span>Logout</span>
                        </button>
                    </div>
                </aside>
                
                <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

                <!-- Main Content -->
                <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 transition-all duration-300 ease-in-out">
                    <!-- Header -->
                    <header class="flex justify-between items-center mb-6">
                         <div>
                            <button id="menu-toggle" class="text-primary">
                                <i data-lucide="menu" class="w-8 h-8"></i>
                            </button>
                            <h2 id="page-title" class="font-poppins text-3xl font-bold text-primary inline-block ml-4 align-middle">Beranda</h2>
                         </div>
                         <div class="flex items-center">
                            <span id="user-greeting" class="text-text-secondary mr-4 hidden md:block"></span>
                            <div class="w-10 h-10 bg-secondary rounded-full flex items-center justify-center text-white font-bold" id="user-avatar"></div>
                        </div>
                    </header>

                    <!-- Page Content goes here -->
                    <div id="page-container">
                        <!-- Content will be dynamically injected here -->
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-surface rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 relative fade-in">
            <!-- Modal content goes here -->
        </div>
    </div>


    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // App State & Mock Database
        const App = {
            state: {
                currentUser: null,
                currentPage: 'home',
                currentExam: {
                    examData: null,
                    questionIndex: 0,
                    studentAnswers: {}
                },
                activityLog: [],
                materials: [
                    { id: 1, title: 'Pengenalan Aljabar', content: '<h3>Bab 1: Dasar-Dasar Aljabar</h3><p>Aljabar adalah cabang matematika yang mempelajari struktur, hubungan, dan kuantitas. Untuk mempelajari aljabar, kita menggunakan simbol (biasanya huruf) untuk merepresentasikan angka.</p><img src="https://placehold.co/600x400/efebe9/3e2723?text=Gambar+Aljabar" class="rounded-lg my-4"/> <p>Contoh: <b>x + 5 = 10</b>. Di sini, <b>x</b> adalah variabel.</p>', author: 'Guru Budi', type: 'text' },
                    { id: 2, title: 'Video: Tata Surya', content: 'https://www.youtube.com/embed/libKVRa01L8', author: 'Guru Citra', type: 'video' },
                    { id: 3, title: 'Dokumen Fotosintesis (PDF)', content: 'Ini adalah konten simulasi PDF tentang proses fotosintesis pada tumbuhan hijau. Klorofil menangkap energi matahari untuk mengubah air dan karbon dioksida menjadi glukosa.', author: 'Guru Budi', type: 'pdf' },
                ],
                exams: [
                    { id: 1, title: 'Ujian Matematika Dasar', token: '1234', createdBy: 'Guru Budi', questions: [
                        { q: '2 + 2 = ?', img: null, options: ['3', '4', '5', '6'], answer: '4' },
                        { q: 'Ibukota Indonesia adalah?', img: 'https://placehold.co/400x200/efebe9/3e2723?text=Peta+Indonesia', options: ['Jakarta', 'Bandung', 'Surabaya', 'Medan'], answer: 'Jakarta' },
                        { q: 'Planet terbesar di tata surya?', img: null, options: ['Bumi', 'Mars', 'Jupiter', 'Saturnus'], answer: 'Jupiter' }
                    ]}
                ],
                examResults: [
                    { examId: 1, student: 'Siswa Ayu', score: 66, timestamp: new Date().toLocaleString('id-ID')},
                    { examId: 1, student: 'Siswa Bayu', score: 100, timestamp: new Date().toLocaleString('id-ID')}
                ],
                chats: [
                    { from: 'Siswa Ayu', message: 'Bagaimana cara melihat nilai ujian?', to: 'admin', timestamp: new Date().toLocaleString('id-ID'), isAnswered: true, answer: 'Halo! Nilai akan langsung tampil setelah Anda menyelesaikan ujian.', botAnswer: null },
                    { from: 'Guru Budi', message: 'Saya tidak bisa mengunggah video.', to: 'admin', timestamp: new Date().toLocaleString('id-ID'), isAnswered: false, answer: null, botAnswer: null }
                ],
                chatTemplates: ['Silakan cek halaman "Tata Cara" untuk panduan.', 'Mohon tunggu sebentar, kami akan segera merespon.', 'Terima kasih telah menghubungi kami.'],
            },
            chatbotRules: {
                'nilai': 'Halo! Nilai akan langsung tampil di layar setelah Anda menyelesaikan dan mengirimkan jawaban ujian.',
                'token': 'Untuk token ujian, silakan minta kepada guru yang membuat ujian tersebut. Token terdiri dari 4 digit angka.',
                'password': 'Jika Anda lupa password, silakan hubungi admin untuk bantuan reset password.',
                'materi': 'Semua materi belajar tersedia di menu "Belajar Yuk". Silakan jelajahi materi yang ada.',
                'error': 'Jika Anda menemukan error, coba muat ulang halaman. Jika masih berlanjut, laporkan masalah ini kepada admin dengan detail.',
                'halo': 'Halo! Ada yang bisa dibantu?',
                'terima kasih': 'Sama-sama! Senang bisa membantu.'
            },
            db: {
                users: [
                    { username: 'admin', password: 'admin', role: 'admin', name: 'Admin Utama' },
                    { username: '12345', password: 'guru', role: 'guru', name: 'Guru Budi', nip: '12345' },
                    { username: '54321', password: 'guru', role: 'guru', name: 'Guru Citra', nip: '54321' },
                    { username: '10101', password: 'siswa', role: 'siswa', name: 'Siswa Ayu', nisn: '10101' },
                    { username: '20202', password: 'siswa', role: 'siswa', name: 'Siswa Bayu', nisn: '20202' },
                ]
            },
            // --- CORE METHODS ---
            init() {
                // Splash screen logic
                setTimeout(() => {
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splash-screen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                    }, 1000);
                }, 3500);

                // Event Listeners
                document.getElementById('login-form').addEventListener('submit', this.handleLogin.bind(this));
                document.getElementById('role-select').addEventListener('change', this.updateLoginForm.bind(this));
                document.getElementById('logout-btn').addEventListener('click', this.handleLogout.bind(this));
                document.getElementById('menu-toggle').addEventListener('click', this.toggleSidebar.bind(this));
                document.getElementById('sidebar-overlay').addEventListener('click', this.toggleSidebar.bind(this));
                document.querySelectorAll('#sidebar nav a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.navigate(link.dataset.page);
                        if (window.innerWidth < 1024) this.toggleSidebar();
                    });
                });
                
                this.updateLoginForm();
            },
            logActivity(message) {
                this.state.activityLog.unshift({
                    user: this.state.currentUser.name,
                    role: this.state.currentUser.role,
                    action: message,
                    timestamp: new Date().toLocaleString('id-ID')
                });
                console.log(`Activity: ${message}`);
            },
            // --- AUTHENTICATION & NAVIGATION ---
            handleLogin(e) {
                e.preventDefault();
                const role = document.getElementById('role-select').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const user = this.db.users.find(u => u.role === role && u.username === username && u.password === password);

                if (user) {
                    this.state.currentUser = user;
                    this.logActivity('Logged in');
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    this.setupDashboard();
                    this.navigate('home');
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            },
            handleLogout() {
                this.logActivity('Logged out');
                this.state.currentUser = null;
                document.getElementById('dashboard').classList.add('hidden');
                document.getElementById('login-page').classList.remove('hidden');
                document.getElementById('login-form').reset();
                document.getElementById('login-error').classList.add('hidden');
            },
            updateLoginForm() {
                const role = document.getElementById('role-select').value;
                const label = document.getElementById('username-label');
                const input = document.getElementById('username');
                if (role === 'siswa') {
                    label.textContent = 'NISN';
                    input.placeholder = 'Masukkan NISN Anda';
                } else if (role === 'guru') {
                    label.textContent = 'NIP';
                    input.placeholder = 'Masukkan NIP Anda';
                } else {
                    label.textContent = 'Username';
                    input.placeholder = 'Masukkan Username Admin';
                }
            },
            setupDashboard() {
                const user = this.state.currentUser;
                document.getElementById('user-greeting').textContent = `Halo, ${user.name}!`;
                document.getElementById('user-avatar').textContent = user.name.charAt(0);
                
                const adminMenu = document.getElementById('admin-menu');
                if (user.role === 'admin') {
                    adminMenu.classList.remove('hidden');
                } else {
                    adminMenu.classList.add('hidden');
                }

                // Set initial sidebar state for desktop
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove('-translate-x-full');
                    mainContent.classList.add('lg:ml-64');
                }
            },
            navigate(page) {
                this.state.currentPage = page;
                const pageTitles = {
                    home: 'Beranda',
                    belajar: 'Belajar Yuk',
                    uji: 'Uji Aja',
                    'ask-admin': 'Ask Admin',
                    panduan: 'Tata Cara Penggunaan',
                    profil: 'Profil Pengguna',
                    'user-management': 'Manajemen Pengguna',
                    'activity-log': 'Log Aktivitas'
                };
                document.getElementById('page-title').textContent = pageTitles[page] || 'Beranda';
                this.renderPage();
            },
            renderPage() {
                const container = document.getElementById('page-container');
                container.innerHTML = '';
                container.classList.add('fade-in');
                
                switch(this.state.currentPage) {
                    case 'home': container.innerHTML = this.renderHomePage(); break;
                    case 'belajar': container.innerHTML = this.renderBelajarPage(); this.attachBelajarListeners(); break;
                    case 'uji': container.innerHTML = this.renderUjiPage(); this.attachUjiListeners(); break;
                    case 'ask-admin': container.innerHTML = this.renderAskAdminPage(); this.attachAskAdminListeners(); break;
                    case 'panduan': container.innerHTML = this.renderPanduanPage(); break;
                    case 'profil': container.innerHTML = this.renderProfilPage(); break;
                    case 'user-management': if (this.state.currentUser.role === 'admin') {
                        container.innerHTML = this.renderUserManagementPage(); 
                        this.attachUserManagementListeners();
                    } break;
                    case 'activity-log': if (this.state.currentUser.role === 'admin') {
                        container.innerHTML = this.renderActivityLogPage();
                    } break;
                }
                lucide.createIcons();
            },
            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');
                const overlay = document.getElementById('sidebar-overlay');

                sidebar.classList.toggle('-translate-x-full');

                if (window.innerWidth < 1024) {
                    // On mobile, manage the overlay
                    overlay.classList.toggle('hidden');
                } else {
                    // On desktop, manage the content margin
                    mainContent.classList.toggle('lg:ml-64');
                }
            },

            // --- PAGE RENDERERS ---
            renderHomePage() {
                const user = this.state.currentUser;
                let statsHtml = '';
                let adminDashboardHtml = '';
                let activityLogHtml = '';

                if (user.role === 'admin') {
                    statsHtml = `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div class="card"><h3 class="font-bold text-xl">${this.db.users.length}</h3><p class="text-text-secondary">Total Pengguna</p></div>
                            <div class="card"><h3 class="font-bold text-xl">${this.state.materials.length}</h3><p class="text-text-secondary">Total Materi</p></div>
                            <div class="card"><h3 class="font-bold text-xl">${this.state.exams.length}</h3><p class="text-text-secondary">Total Ujian</p></div>
                             <div class="card"><h3 class="font-bold text-xl">${this.state.activityLog.filter(a => a.action === 'Logged in').length}</h3><p class="text-text-secondary">Sesi Login Hari Ini</p></div>
                        </div>
                    `;
                    adminDashboardHtml = `
                        <div class="card">
                            <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                                <h3 class="font-poppins font-bold text-xl">Dasbor Admin: Manajemen Pengguna</h3>
                                <button class="btn btn-primary" onclick="App.showUserForm()"><i data-lucide="user-plus" class="inline-block mr-2"></i>Tambah Pengguna</button>
                            </div>
                            <p class="text-text-secondary mb-4">Tambah guru atau siswa baru dan lihat pengguna yang baru saja ditambahkan.</p>
                             <h4 class="font-bold text-lg mb-2">Pengguna Terbaru</h4>
                             <ul class="space-y-2">
                                ${this.db.users.slice(-5).reverse().map(u => `
                                    <li class="flex items-center justify-between p-2 rounded-lg bg-background">
                                        <div>
                                            <span class="font-bold">${u.name}</span>
                                            <span class="text-sm text-text-secondary ml-2 capitalize">(${u.role})</span>
                                        </div>
                                        <span class="text-xs text-gray-500">ID: ${u.username}</span>
                                    </li>
                                `).join('')}
                             </ul>
                        </div>
                    `;
                    activityLogHtml = `
                        <div class="card">
                            <h3 class="font-poppins font-bold text-xl mb-4">Aktivitas Terbaru</h3>
                            <ul class="space-y-3">
                                ${this.state.activityLog.slice(0, 5).map(log => `
                                    <li class="flex items-center text-sm p-2 rounded-lg bg-background">
                                        <span class="font-bold mr-2 text-primary">[${log.role}] ${log.user}</span>
                                        <span class="text-text-secondary mr-2">${log.action}</span>
                                        <span class="ml-auto text-xs text-gray-500">${log.timestamp}</span>
                                    </li>
                                `).join('') || '<p>Belum ada aktivitas.</p>'}
                            </ul>
                        </div>
                    `;
                } else if (user.role === 'guru') {
                     statsHtml = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="card"><h3 class="font-bold text-xl">${this.state.materials.filter(m => m.author === user.name).length}</h3><p class="text-text-secondary">Materi Anda</p></div>
                            <div class="card"><h3 class="font-bold text-xl">${this.state.exams.filter(e => e.createdBy === user.name).length}</h3><p class="text-text-secondary">Ujian Dibuat</p></div>

            // --- FEATURE LOGIC & LISTENERS ---
            attachBelajarListeners() {
                const addBtn = document.getElementById('add-materi-btn');
                if (addBtn) addBtn.addEventListener('click', () => this.showMateriForm());
            },
            showMateriForm(materi = null) {
                const isEditing = materi !== null;
                const modalContent = `
                    <h2 class="font-poppins font-bold text-2xl mb-4">${isEditing ? 'Edit' : 'Tambah'} Materi</h2>
                    <form id="materi-form" class="space-y-4">
                        <input type="hidden" id="materi-id" value="${isEditing ? materi.id : ''}">
                        <div>
                            <label class="font-bold">Judul Materi</label>
                            <input type="text" id="materi-title" class="input-field" value="${isEditing ? materi.title : ''}" required>
                        </div>
                        <div>
                            <label class="font-bold">Tipe Materi</label>
                            <select id="materi-type" class="input-field">
                                <option value="text" ${isEditing && materi.type === 'text' ? 'selected' : ''}>Teks & Gambar</option>
                                <option value="video" ${isEditing && materi.type === 'video' ? 'selected' : ''}>Video (YouTube Embed)</option>
                                <option value="pdf" ${isEditing && materi.type === 'pdf' ? 'selected' : ''}>PDF (Teks)</option>
                            </select>
                        </div>
                        <div id="content-container">
                            <!-- content input will be here -->
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </div>
                    </form>
                `;
                this.showModal(modalContent);

                const typeSelect = document.getElementById('materi-type');
                const contentContainer = document.getElementById('content-container');

                const attachTextEditorListeners = () => {
                    const insertImageBtn = document.getElementById('insert-image-btn');
                    if (insertImageBtn) {
                        insertImageBtn.addEventListener('click', () => {
                            const imageUrl = prompt('Masukkan URL gambar:', 'https://placehold.co/600x400');
                            if (imageUrl) {
                                const contentTextarea = document.getElementById('materi-content');
                                const markdownImage = `\n\n![Gambar](${imageUrl})\n`;
                                contentTextarea.value += markdownImage;
                            }
                        });
                    }
                };

                const updateContentInput = () => {
                    const type = typeSelect.value;
                    let contentInputHtml = '';
                    let value = isEditing && materi.type === type ? materi.content : '';

                    if (type === 'text') {
                        contentInputHtml = `
                            <div class="flex justify-between items-center mb-1">
                                <label class="font-bold">Konten</label>
                                <button type="button" id="insert-image-btn" class="text-sm btn-outline py-1 px-2 rounded-md flex items-center">
                                    <i data-lucide="image-plus" class="inline-block w-4 h-4 mr-1"></i>Sisipkan Gambar
                                </button>
                            </div>
                            <textarea id="materi-content" class="input-field min-h-[200px]" placeholder="Anda bisa menggunakan Markdown. Klik 'Sisipkan Gambar' untuk menambah gambar.">${value}</textarea>
                        `;
                    } else if (type === 'video') {
                        contentInputHtml = `<label class="font-bold">URL YouTube Embed</label><input type="text" id="materi-content" class="input-field" placeholder="Contoh: https://www.youtube.com/embed/..." value="${value}">`;
                    } else { // pdf
                        contentInputHtml = `<label class="font-bold">Konten PDF (Simulasi Teks)</label><textarea id="materi-content" class="input-field min-h-[200px]" placeholder="Salin teks dari PDF ke sini.">${value}</textarea>`;
                    }
                    contentContainer.innerHTML = contentInputHtml;
                    if(type === 'text') {
                        attachTextEditorListeners();
                        lucide.createIcons();
                    }
                };

                updateContentInput();
                typeSelect.addEventListener('change', updateContentInput);

                document.getElementById('materi-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveMateri();
                });
            },
            saveMateri() {
                const id = document.getElementById('materi-id').value;
                const title = document.getElementById('materi-title').value;
                const type = document.getElementById('materi-type').value;
                const content = document.getElementById('materi-content').value;
                
                if (id) { // Editing
                    const index = this.state.materials.findIndex(m => m.id == id);
                    this.state.materials[index] = { ...this.state.materials[index], title, type, content };
                    this.logActivity(`Mengedit materi: ${title}`);
                } else { // Adding
                    const newMateri = {
                        id: Date.now(),
                        title, type, content,
                        author: this.state.currentUser.name
                    };
                    this.state.materials.push(newMateri);
                    this.logActivity(`Menambah materi baru: ${title}`);
                }
                this.closeModal();
                this.renderPage();
            },
            viewMateri(id) {
                const materi = this.state.materials.find(m => m.id === id);
                let contentHtml = '';
                if (materi.type === 'video') {
                     contentHtml = `<div class="aspect-w-16 aspect-h-9"><iframe src="${materi.content}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="w-full h-full rounded-lg"></iframe></div>`;
                } else if (materi.type === 'pdf') {
                    contentHtml = `<div class="prose max-w-none bg-gray-50 p-4 rounded-lg border">${new showdown.Converter().makeHtml(materi.content)}</div>`;
                } else { // text
                    const converter = new showdown.Converter({ghCompatibleHeaderId: true, simpleLineBreaks: true, strikethrough: true});
                    contentHtml = `<div class="prose max-w-none">${converter.makeHtml(materi.content)}</div>`;
                }
                
                const modalContent = `
                    <h2 class="font-poppins font-bold text-2xl mb-2">${materi.title}</h2>
                    <p class="text-sm text-text-secondary mb-4">Oleh: ${materi.author}</p>
                    ${contentHtml}
                    <div class="text-right mt-6">
                        <button class="btn btn-primary" onclick="App.closeModal()">Tutup</button>
                    </div>
                `;
                this.showModal(modalContent, 'max-w-4xl');
                this.logActivity(`Melihat materi: ${materi.title}`);
            },
            editMateri(id) {
                const materi = this.state.materials.find(m => m.id === id);
                this.showMateriForm(materi);
            },
            deleteMateri(id) {
                if (confirm('Anda yakin ingin menghapus materi ini?')) {
                    const title = this.state.materials.find(m => m.id === id)?.title;
                    this.state.materials = this.state.materials.filter(m => m.id !== id);
                    this.logActivity(`Menghapus materi: ${title}`);
                    this.renderPage();
                }
            },
            
            attachUjiListeners() {
                const addBtn = document.getElementById('add-ujian-btn');
                if (addBtn) addBtn.addEventListener('click', () => this.showUjianForm());

                const tokenForm = document.getElementById('token-form');
                if(tokenForm) tokenForm.addEventListener('submit', this.startUjian.bind(this));
            },
            showUjianForm(exam = null) {
                const isEditing = exam !== null;
                const questionsHtml = (exam?.questions || [{ q: '', img: null, options: ['', '', '', ''], answer: '' }])
                    .map((q, index) => this.getQuestionHtml(index, q)).join('');

                const modalContent = `
                    <h2 class="font-poppins font-bold text-2xl mb-4">${isEditing ? 'Edit' : 'Buat'} Ujian</h2>
                    <form id="ujian-form">
                        <input type="hidden" id="ujian-id" value="${isEditing ? exam.id : ''}">
                        <div class="mb-4">
                            <label class="font-bold">Judul Ujian</label>
                            <input type="text" id="ujian-title" class="input-field" value="${isEditing ? exam.title : ''}" required>
                        </div>
                        <div id="questions-container" class="space-y-6">${questionsHtml}</div>
                        <button type="button" id="add-question-btn" class="btn btn-outline mt-6"><i data-lucide="plus" class="inline-block mr-2"></i>Tambah Pertanyaan</button>
                        <div class="flex justify-end gap-2 mt-6">
                            <button type="button" class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                            <button type="submit" class="btn btn-primary">Simpan Ujian</button>
                        </div>
                    </form>
                `;
                this.showModal(modalContent, 'max-w-3xl');
                lucide.createIcons();
                document.getElementById('add-question-btn').addEventListener('click', () => {
                    const container = document.getElementById('questions-container');
                    const newIndex = container.children.length;
                    container.insertAdjacentHTML('beforeend', this.getQuestionHtml(newIndex));
                    lucide.createIcons();
                });
                 document.getElementById('ujian-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveUjian();
                });
            },
            getQuestionHtml(index, question = { q: '', img: null, options: ['', '', '', ''], answer: '' }) {
                 return `
                    <div class="p-4 border rounded-lg bg-gray-50 question-item">
                        <label class="font-bold">Pertanyaan ${index + 1}</label>
                        <textarea class="input-field mt-1" placeholder="Tulis pertanyaan di sini..." required>${question.q}</textarea>
                        <label class="text-sm font-bold mt-2 block">URL Gambar (Opsional)</label>
                        <input type="text" class="input-field text-sm" placeholder="https://..." value="${question.img || ''}">
                        <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${question.options.map((opt, i) => `
                                <div class="flex items-center">
                                    <input type="radio" name="answer_${index}" value="${String.fromCharCode(65 + i)}" class="mr-2" ${question.answer === opt ? 'checked' : ''} required>
                                    <input type="text" class="input-field" placeholder="Opsi ${String.fromCharCode(65 + i)}" value="${opt}" required>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                 `;
            },
            saveUjian() {
                const id = document.getElementById('ujian-id').value;
                const title = document.getElementById('ujian-title').value;
                const questions = [];
                document.querySelectorAll('.question-item').forEach((item, index) => {
                    const q = item.querySelector('textarea').value;
                    const img = item.querySelectorAll('input[type="text"]')[0].value || null;
                    const options = Array.from(item.querySelectorAll('input[type="text"]')).slice(1).map(i => i.value);
                    const correctOptionInput = item.querySelector(`input[name="answer_${index}"]:checked`);
                    const answerIndex = correctOptionInput ? correctOptionInput.value.charCodeAt(0) - 65 : -1;
                    const answer = answerIndex > -1 ? options[answerIndex] : null;

                    if (q && options.every(o => o) && answer) {
                        questions.push({ q, img, options, answer });
                    }
                });

                if (questions.length === 0) {
                    alert('Harap isi setidaknya satu pertanyaan dengan lengkap.');
                    return;
                }

                if (id) { // Editing
                    const index = this.state.exams.findIndex(e => e.id == id);
                    this.state.exams[index] = { ...this.state.exams[index], title, questions };
                    this.logActivity(`Mengedit ujian: ${title}`);
                } else { // Adding
                    const newExam = {
                        id: Date.now(),
                        title,
                        questions,
                        createdBy: this.state.currentUser.name,
                        token: Math.floor(1000 + Math.random() * 9000).toString()
                    };
                    this.state.exams.push(newExam);
                    this.logActivity(`Membuat ujian baru: ${title}`);
                }
                this.closeModal();
                this.renderPage();
            },
            editUjian(id) {
                const exam = this.state.exams.find(e => e.id === id);
                this.showUjianForm(exam);
            },
            deleteUjian(id) {
                if(confirm('Anda yakin ingin menghapus ujian ini? Semua data nilai terkait akan ikut terhapus.')) {
                    const title = this.state.exams.find(e => e.id === id)?.title;
                    this.state.exams = this.state.exams.filter(e => e.id !== id);
                    this.state.examResults = this.state.examResults.filter(r => r.examId !== id);
                    this.logActivity(`Menghapus ujian: ${title}`);
                    this.renderPage();
                }
            },
            startUjian(e) {
                e.preventDefault();
                const token = document.getElementById('token-input').value;
                const exam = this.state.exams.find(ex => ex.token === token);
                if(exam) {
                    this.logActivity(`Memulai ujian: ${exam.title}`);
                    // Reset and setup current exam state
                    this.state.currentExam = {
                        examData: exam,
                        questionIndex: 0,
                        studentAnswers: {}
                    };
                    this.renderExam(); // No longer passes exam as argument
                } else {
                    document.getElementById('token-error').classList.remove('hidden');
                }
            },
            renderExam() {
                const { examData, questionIndex } = this.state.currentExam;
                const container = document.getElementById('page-container');
                const question = examData.questions[questionIndex];
                const studentAnswer = this.state.currentExam.studentAnswers[questionIndex];

                const progress = ((questionIndex + 1) / examData.questions.length) * 100;

                let questionHtml = `
                    <div class="card mb-6 fade-in">
                        <p class="font-bold mb-2">${questionIndex + 1}. ${question.q}</p>
                        ${question.img ? `<img src="${question.img}" class="rounded-lg my-4 max-w-sm mx-auto">` : ''}
                        <div class="space-y-2 mt-4">
                            ${question.options.map(opt => `
                                <label class="flex items-center p-3 border rounded-lg hover:bg-gray-100 cursor-pointer">
                                    <input type="radio" name="question_${questionIndex}" value="${opt}" class="mr-3" onchange="App.saveAnswer(${questionIndex}, this.value)" ${studentAnswer === opt ? 'checked' : ''}>
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;

                container.innerHTML = `
                    <h2 class="font-poppins text-3xl font-bold text-primary">${examData.title}</h2>
                    <p class="text-text-secondary mt-1 mb-4">Pertanyaan ${questionIndex + 1} dari ${examData.questions.length}</p>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                        <div class="bg-primary h-2.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    <div id="exam-question-container">
                        ${questionHtml}
                    </div>
                    <div class="mt-6 flex justify-between items-center">
                        <button id="prev-btn" class="btn btn-outline" ${questionIndex === 0 ? 'disabled' : ''}>
                            <i data-lucide="arrow-left" class="inline-block mr-2"></i>Sebelumnya
                        </button>
                        <button id="next-btn" class="btn btn-primary">
                            <span>${questionIndex === examData.questions.length - 1 ? 'Selesai' : 'Selanjutnya'}</span>
                            <i data-lucide="arrow-right" class="inline-block ml-2"></i>
                        </button>
                    </div>
                `;
                lucide.createIcons();
                this.attachExamNavListeners();
            },
            saveAnswer(questionIndex, answer) {
                this.state.currentExam.studentAnswers[questionIndex] = answer;
            },
            attachExamNavListeners() {
                document.getElementById('prev-btn').addEventListener('click', () => {
                    if (this.state.currentExam.questionIndex > 0) {
                        this.state.currentExam.questionIndex--;
                        this.renderExam();
                    }
                });

                document.getElementById('next-btn').addEventListener('click', () => {
                    const { questionIndex, examData } = this.state.currentExam;
                    if (questionIndex < examData.questions.length - 1) {
                        this.state.currentExam.questionIndex++;
                        this.renderExam();
                    } else {
                        // Last question, show confirmation
                        this.showFinishConfirmation();
                    }
                });
            },
            showFinishConfirmation() {
                const modalContent = `
                    <div class="text-center">
                        <i data-lucide="alert-triangle" class="w-16 h-16 text-accent mx-auto mb-4"></i>
                        <h2 class="font-poppins font-bold text-2xl mb-2">Konfirmasi Selesai</h2>
                        <p class="text-text-secondary">Gamau dicek lagi nih?</p>
                        <div class="flex justify-center gap-4 mt-6">
                            <button id="cek-ulang-btn" class="btn btn-outline">Cek Ulang</button>
                            <button id="yakin-btn" class="btn btn-primary">Yakin</button>
                        </div>
                    </div>
                `;
                this.showModal(modalContent);

                document.getElementById('cek-ulang-btn').addEventListener('click', () => this.closeModal());
                document.getElementById('yakin-btn').addEventListener('click', () => {
                    this.closeModal();
                    this.submitExam();
                });
            },
            submitExam() {
                const { examData, studentAnswers } = this.state.currentExam;
                let score = 0;
                examData.questions.forEach((q, index) => {
                    if(studentAnswers[index] && studentAnswers[index] === q.answer) {
                        score++;
                    }
                });
                const finalScore = Math.round((score / examData.questions.length) * 100);
                
                this.state.examResults.push({
                    examId: examData.id,
                    student: this.state.currentUser.name,
                    score: finalScore,
                    timestamp: new Date().toLocaleString('id-ID')
                });
                this.logActivity(`Menyelesaikan ujian: ${examData.title} dengan nilai ${finalScore}`);
                
                const container = document.getElementById('page-container');
                container.innerHTML = `
                    <div class="card text-center max-w-lg mx-auto">
                         <h2 class="font-poppins text-2xl font-bold">Ujian Selesai!</h2>
                         <p class="text-text-secondary mt-2">Berikut adalah hasil ujianmu.</p>
                         <div class="my-8">
                            <p class="text-lg">Nilai Kamu</p>
                            <p class="font-poppins font-bold text-7xl text-primary">${finalScore}</p>
                         </div>
                         <button class="btn btn-primary" onclick="App.navigate('uji')">Kembali</button>
                    </div>
                `;

                // Clear current exam state
                this.state.currentExam = {
                    examData: null,
                    questionIndex: 0,
                    studentAnswers: {}
                };
            },
            viewExamResults(examId) {
                const exam = this.state.exams.find(e => e.id === examId);
                const results = this.state.examResults.filter(r => r.examId === examId)
                                .sort((a, b) => b.score - a.score);
                const modalContent = `
                    <h2 class="font-poppins font-bold text-2xl mb-4">Papan Nilai: ${exam.title}</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b">
                                    <th class="p-3 font-bold">Peringkat</th>
                                    <th class="p-3 font-bold">Nama Siswa</th>
                                    <th class="p-3 font-bold">Nilai</th>
                                    <th class="p-3 font-bold">Waktu</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${results.map((res, index) => `
                                    <tr class="border-b hover:bg-gray-50">
                                        <td class="p-3 font-bold">${index + 1}</td>
                                        <td class="p-3">${res.student}</td>
                                        <td class="p-3 font-bold text-primary">${res.score}</td>
                                        <td class="p-3 text-sm">${res.timestamp}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4" class="text-center p-4">Belum ada siswa yang mengerjakan.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                     <div class="text-right mt-6">
                        <button class="btn btn-primary" onclick="App.closeModal()">Tutup</button>
                    </div>
                `;
                this.showModal(modalContent);
                this.logActivity(`Melihat hasil ujian: ${exam.title}`);
            },

            attachAskAdminListeners() {
                if (this.state.currentUser.role === 'admin') {
                    document.getElementById('add-template-btn').addEventListener('click', this.addChatTemplate.bind(this));
                } else {
                    document.getElementById('chat-form').addEventListener('submit', this.sendChatMessage.bind(this));
                    this.loadChatHistory();
                }
            },
            loadChatHistory() {
                const user = this.state.currentUser;
                const historyContainer = document.getElementById('chat-history');
                const userChats = this.state.chats.filter(c => c.from === user.name);
                
                historyContainer.innerHTML = userChats.map(chat => {
                    const isUser = chat.from === user.name;
                    return `
                        <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-xs lg:max-w-md p-3 rounded-lg ${isUser ? 'bg-primary text-white' : 'bg-white shadow-sm'}">
                                <p>${chat.message}</p>
                                ${chat.botAnswer ? `<div class="mt-2 pt-2 border-t ${isUser ? 'border-white/20' : 'border-gray-200'} text-sm opacity-90"><b class="block">Admin Pintarku (Otomatis)</b> ${chat.botAnswer}</div>` : ''}
                                ${chat.answer ? `<div class="mt-2 pt-2 border-t ${isUser ? 'border-white/20' : 'border-gray-200'} text-sm opacity-80"><b>Admin:</b> ${chat.answer}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                historyContainer.scrollTop = historyContainer.scrollHeight;
            },
            sendChatMessage(e) {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const message = input.value.trim();
                if (!message) return;

                const userMessage = {
                    from: this.state.currentUser.name,
                    message,
                    to: 'admin',
                    timestamp: new Date().toLocaleString('id-ID'),
                    isAnswered: false,
                    answer: null,
                    botAnswer: null
                };
                this.state.chats.push(userMessage);
                this.logActivity(`Mengirim pesan ke admin: "${message}"`);
                input.value = '';
                this.loadChatHistory();

                // Simulate chatbot reply
                setTimeout(() => {
                    let botReplied = false;
                    const lowerCaseMessage = message.toLowerCase();

                    for (const keyword in this.chatbotRules) {
                        if (lowerCaseMessage.includes(keyword)) {
                            userMessage.botAnswer = this.chatbotRules[keyword];
                            botReplied = true;
                            this.loadChatHistory(); // Re-render to show bot answer
                            break;
                        }
                    }

                    // If no keyword matched, send a random template reply
                    if (!botReplied && this.state.chatTemplates.length > 0) {
                        const randomIndex = Math.floor(Math.random() * this.state.chatTemplates.length);
                        userMessage.botAnswer = this.state.chatTemplates[randomIndex];
                        this.loadChatHistory();
                    } else if (!botReplied) {
                        // Fallback if no templates exist
                        userMessage.botAnswer = 'Terima kasih! Pesan Anda telah diterima.';
                        this.loadChatHistory();
                    }
                }, 1500); // Delay for realistic feel
            },
            openAdminChat(chatIndex) {
                const chat = this.state.chats[chatIndex];
                const container = document.getElementById('chat-detail-admin');
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold">Chat dari ${chat.from}</h3>
                        <span class="text-xs text-gray-500">${chat.timestamp}</span>
                    </div>
                    <div class="bg-background p-4 rounded-lg mb-4">
                        <p>${chat.message}</p>
                        ${chat.botAnswer ? `<div class="mt-2 pt-2 border-t border-gray-300 text-sm text-blue-700"><b>Balasan Otomatis:</b> ${chat.botAnswer}</div>` : ''}
                    </div>
                    <form id="admin-reply-form">
                        <textarea id="admin-reply-textarea" class="input-field min-h-[100px]" placeholder="Ketik balasan Anda...">${chat.answer || ''}</textarea>
                        <div class="my-2">
                             <p class="text-sm font-bold">Gunakan Template:</p>
                             <div class="flex flex-wrap gap-1 mt-1">
                                ${this.state.chatTemplates.map(t => `<button type="button" class="btn-template text-xs bg-secondary/30 px-2 py-1 rounded">${t}</button>`).join('')}
                             </div>
                        </div>
                        <div class="text-right mt-4">
                            <button type="submit" class="btn btn-primary">Kirim Balasan</button>
                        </div>
                    </form>
                `;
                document.querySelectorAll('.btn-template').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('admin-reply-textarea').value = btn.textContent;
                    });
                });
                document.getElementById('admin-reply-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const reply = document.getElementById('admin-reply-textarea').value;
                    if (!reply) return;
                    chat.answer = reply;
                    chat.isAnswered = true;
                    this.logActivity(`Membalas pesan dari ${chat.from}`);
                    this.renderPage(); // re-render to update list
                });
            },
            addChatTemplate() {
                const input = document.getElementById('new-template-input');
                const template = input.value;
                if(template && !this.state.chatTemplates.includes(template)) {
                    this.state.chatTemplates.push(template);
                    this.logActivity(`Menambah template chat baru.`);
                    input.value = '';
                    this.renderPage();
                }
            },
            deleteChatTemplate(index) {
                 this.state.chatTemplates.splice(index, 1);
                 this.logActivity(`Menghapus template chat.`);
                 this.renderPage();
            },

            attachUserManagementListeners() {
                document.getElementById('add-user-btn').addEventListener('click', this.showUserForm.bind(this));
            },
            showUserForm() {
                const modalContent = `
                    <h2 class="font-poppins font-bold text-2xl mb-4">Tambah Pengguna Baru</h2>
                    <form id="user-form" class="space-y-4">
                        <div>
                            <label class="font-bold">Peran</label>
                            <select id="new-user-role" class="input-field">
                                <option value="siswa">Siswa</option>
                                <option value="guru">Guru</option>
                            </select>
                        </div>
                         <div>
                            <label class="font-bold">Nama Lengkap</label>
                            <input type="text" id="new-user-name" class="input-field" required>
                        </div>
                        <div>
                            <label id="new-user-id-label" class="font-bold">NISN</label>
                            <input type="text" id="new-user-id" class="input-field" required>
                        </div>
                        <div>
                            <label class="font-bold">Password</label>
                            <input type="password" id="new-user-password" class="input-field" required>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                            <button type="submit" class="btn btn-primary">Tambah</button>
                        </div>
                    </form>
                `;
                this.showModal(modalContent);

                const roleSelect = document.getElementById('new-user-role');
                const idLabel = document.getElementById('new-user-id-label');
                roleSelect.addEventListener('change', () => {
                    idLabel.textContent = roleSelect.value === 'siswa' ? 'NISN' : 'NIP';
                });

                document.getElementById('user-form').addEventListener('submit', this.saveUser.bind(this));
            },
            saveUser(e) {
                e.preventDefault();
                const role = document.getElementById('new-user-role').value;
                const name = document.getElementById('new-user-name').value;
                const id = document.getElementById('new-user-id').value;
                const password = document.getElementById('new-user-password').value;

                if (this.db.users.some(u => u.username === id)) {
                    alert('Username/NIP/NISN sudah digunakan.');
                    return;
                }

                const newUser = {
                    username: id,
                    password,
                    role,
                    name,
                };
                if (role === 'siswa') newUser.nisn = id;
                if (role === 'guru') newUser.nip = id;

                this.db.users.push(newUser);
                this.logActivity(`Menambah pengguna baru: ${name} (${role})`);
                this.closeModal();
                this.renderPage();
            },
            deleteUser(username, role) {
                if(confirm(`Anda yakin ingin menghapus pengguna ini? Semua data terkait (materi, ujian, nilai) akan tetap ada namun tidak terhubung.`)) {
                    this.db.users = this.db.users.filter(u => !(u.username === username && u.role === role));
                    this.logActivity(`Menghapus pengguna: ${username} (${role})`);
                    this.renderPage();
                }
            },

            // --- UTILITY METHODS ---
            showModal(content, maxWidthClass = 'max-w-lg') {
                const modalContainer = document.getElementById('modal-container');
                const modalContentEl = document.getElementById('modal-content');
                modalContentEl.className = `bg-surface rounded-xl shadow-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative fade-in ${maxWidthClass}`;
                modalContentEl.innerHTML = `<button onclick="App.closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800"><i data-lucide="x"></i></button>` + content;
                modalContainer.classList.remove('hidden');
                modalContainer.classList.add('flex');
                lucide.createIcons();
            },
            closeModal() {
                const modalContainer = document.getElementById('modal-container');
                modalContainer.classList.add('hidden');
                modalContainer.classList.remove('flex');
                document.getElementById('modal-content').innerHTML = '';
            }
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
