<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintarku - Belajar & Ujian Jadi Lebih Menyenangkan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #6d4c41; /* Brown */
            --secondary: #a1887f; /* Lighter Brown */
            --accent: #ffab40; /* Amber */
            --background: #efebe9; /* Brownish White */
            --text-primary: #3e2723; /* Dark Brown */
            --text-secondary: #5d4037;
            --surface: #ffffff;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        .bg-primary { background-color: var(--primary); }
        .bg-secondary { background-color: var(--secondary); }
        .bg-accent { background-color: var(--accent); }
        .bg-surface { background-color: var(--surface); }
        .text-primary { color: var(--primary); }
        .text-accent { color: var(--accent); }
        .border-primary { border-color: var(--primary); }
        .border-secondary { border-color: var(--secondary); }

        .btn {
            @apply font-bold py-2 px-4 rounded-lg shadow-md transition-all duration-300 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:scale-100;
        }

        .btn-primary {
            @apply bg-primary text-white hover:bg-opacity-90;
        }
        
        .btn-danger {
             @apply bg-red-500 text-white hover:bg-red-600;
        }

        .btn-outline {
            @apply bg-transparent border border-primary text-primary hover:bg-primary hover:text-white;
        }

        .input-field {
            @apply w-full px-4 py-2 border border-secondary rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary transition-colors duration-300;
        }

        .card {
            @apply bg-surface rounded-xl shadow-lg overflow-hidden p-6 transition-transform duration-300 hover:shadow-xl hover:-translate-y-1;
        }
        
        .loader {
            @apply w-12 h-12 border-4 border-t-primary border-gray-200 rounded-full animate-spin;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        @keyframes fadeOutSmooth {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-out-smooth {
            animation: fadeOutSmooth 0.5s ease-out forwards;
        }

        #splash-screen {
            z-index: 100;
        }

        .welcome-text {
            animation: fadeIn 1s ease-out 0.5s forwards, fadeOut 1s ease-in 2.5s forwards;
            opacity: 0;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--background);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        .prose iframe {
            @apply w-full aspect-video rounded-lg shadow-md;
        }
        .prose img {
             @apply max-w-full h-auto rounded-lg shadow-md;
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-primary flex flex-col items-center justify-center transition-opacity duration-1000 ease-in-out">
        <div class="text-center text-white">
            <svg class="w-24 h-24 mx-auto mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v11.494m-5.22-6.22l5.22 6.22 5.22-6.22M3 10.5a9 9 0 1118 0c0 2.485-1.19 4.75-3.1 6.25"></path></svg>
            <h1 class="font-poppins text-4xl font-bold welcome-text">Selamat Datang di Pintarku</h1>
            <p class="mt-2 text-lg welcome-text">Belajar dan Ujian Jadi Lebih Menyenangkan!</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app" class="hidden">
        <!-- Login Page -->
        <div id="login-page" class="min-h-screen flex items-center justify-center bg-background px-4">
            <div class="w-full max-w-md card fade-in">
                <div class="text-center">
                    <svg class="w-16 h-16 mx-auto text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v11.494m-5.22-6.22l5.22 6.22 5.22-6.22M3 10.5a9 9 0 1118 0c0 2.485-1.19 4.75-3.1 6.25"></path></svg>
                    <h2 class="font-poppins text-3xl font-bold mt-4">Login ke Pintarku</h2>
                    <p class="text-text-secondary mt-2">Silakan pilih peran dan masukkan kredensial Anda.</p>
                </div>
                <form id="login-form" class="mt-8 space-y-6">
                    <div>
                        <label for="role-select" class="block text-sm font-bold text-text-secondary">Masuk sebagai:</label>
                        <select id="role-select" class="input-field mt-1">
                            <option value="siswa">Siswa</option>
                            <option value="guru">Guru</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label for="email" id="email-label" class="block text-sm font-bold text-text-secondary">Email</label>
                        <input type="email" id="email" class="input-field mt-1" required placeholder="email@anda.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-bold text-text-secondary">Password</label>
                        <input type="password" id="password" class="input-field mt-1" required>
                    </div>
                    <p id="login-error" class="text-red-500 text-sm hidden">Login gagal. Periksa kembali data Anda.</p>
                    <button type="submit" class="w-full btn btn-primary">Login</button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboard" class="hidden">
             <div class="relative min-h-screen lg:flex">
                <!-- Sidebar -->
                <aside id="sidebar" class="fixed top-0 left-0 h-full z-30 w-64 bg-primary text-white flex-shrink-0 transition-transform duration-300 ease-in-out -translate-x-full">
                    <div class="p-4 text-center border-b border-white/20">
                        <h1 class="font-poppins text-2xl font-bold">Pintarku</h1>
                    </div>
                    <nav class="mt-4">
                        <a href="#" data-page="home" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                            <i data-lucide="home"></i><span class="ml-3">Beranda</span>
                        </a>
                        <a href="#" data-page="belajar" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                            <i data-lucide="book-open"></i><span class="ml-3">Belajar Yuk</span>
                        </a>
                        <a href="#" data-page="uji" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="file-check-2"></i><span class="ml-3">Uji Aja</span>
                        </a>
                        <a href="#" data-page="ask-admin" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="message-square"></i><span class="ml-3">Ask Admin</span>
                        </a>
                        <a href="#" data-page="panduan" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="help-circle"></i><span class="ml-3">Tata Cara</span>
                        </a>
                        <a href="#" data-page="profil" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                           <i data-lucide="user"></i><span class="ml-3">Profil</span>
                        </a>
                        <!-- Admin Only Menu -->
                        <div id="admin-menu" class="hidden">
                             <hr class="my-2 border-white/20">
                            <a href="#" data-page="user-management" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                               <i data-lucide="users"></i><span class="ml-3">Manajemen User</span>
                            </a>
                            <a href="#" data-page="activity-log" class="flex items-center px-4 py-3 hover:bg-white/10 transition-colors duration-200">
                               <i data-lucide="activity"></i><span class="ml-3">Log Aktivitas</span>
                            </a>
                        </div>
                    </nav>
                     <div class="absolute bottom-4 left-4 right-4">
                        <button id="logout-btn" class="w-full flex items-center justify-center px-4 py-2 bg-red-500 hover:bg-red-600 transition-colors duration-200 rounded-lg">
                            <i data-lucide="log-out" class="mr-2"></i><span>Logout</span>
                        </button>
                    </div>
                </aside>
                
                <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

                <!-- Main Content -->
                <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 transition-all duration-300 ease-in-out">
                    <!-- Header -->
                    <header class="flex justify-between items-center mb-6">
                         <div>
                            <button id="menu-toggle" class="text-primary">
                                <i data-lucide="menu" class="w-8 h-8"></i>
                            </button>
                            <h2 id="page-title" class="font-poppins text-3xl font-bold text-primary inline-block ml-4 align-middle">Beranda</h2>
                         </div>
                         <div class="flex items-center">
                            <span id="user-greeting" class="text-text-secondary mr-4 hidden md:block"></span>
                            <div class="w-10 h-10 bg-secondary rounded-full flex items-center justify-center text-white font-bold" id="user-avatar"></div>
                        </div>
                    </header>

                    <!-- Page Content goes here -->
                    <div id="page-container">
                        <!-- Content will be dynamically injected here -->
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-surface rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 relative fade-in">
            <!-- Modal content goes here -->
        </div>
    </div>


    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // 2. Konfigurasi Klien Supabase
        const SUPABASE_URL = 'https://dfnwpbyxsgfohcosiker.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmbndwYnl4c2dmb2hjb3Npa2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0NzcxOTAsImV4cCI6MjA3NjA1MzE5MH0.yrlK03eorWljWLjyC4nQFr8pa7jI7BM6BLboVjLsO1E';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // App State
        const App = {
            state: {
                currentUser: null,
                currentPage: 'home',
                pageCache: {},
                // --- STATE BARU UNTUK KUIS ---
                currentQuiz: {
                    quizData: null,
                    questions: [],
                    userAnswers: [], // Array untuk menyimpan jawaban
                    currentIndex: 0   // Soal ke berapa yang sedang dilihat
                },
            },
            
            // --- CORE METHODS ---
            async init() {
                setTimeout(() => {
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splash-screen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                    }, 1000);
                }, 3500);

                supabase.auth.onAuthStateChange(async (_event, session) => {
                    if (session) {
                        const { data: profile } = await supabase
                            .from('profiles')
                            .select('*')
                            .eq('id', session.user.id)
                            .single();
                        
                        if (profile) {
                            this.state.currentUser = { ...session.user, ...profile };
                            document.getElementById('login-page').classList.add('hidden');
                            document.getElementById('dashboard').classList.remove('hidden');
                            this.setupDashboard();
                            this.navigate('home');
                        } else {
                            await this.handleLogout();
                        }
                    } else {
                        this.state.currentUser = null;
                        document.getElementById('dashboard').classList.add('hidden');
                        document.getElementById('login-page').classList.remove('hidden');
                    }
                });

                document.getElementById('login-form').addEventListener('submit', this.handleLogin.bind(this));
                
                // --- PERBAIKAN LOGOUT: Event Delegation ---
                // We add one listener to the parent container that is always present.
                document.getElementById('app').addEventListener('click', (e) => {
                    // Check if the clicked element or its parent is the logout button
                    if (e.target.closest('#logout-btn')) {
                        this.handleLogout();
                    }
                });

                document.getElementById('menu-toggle').addEventListener('click', this.toggleSidebar.bind(this));
                document.getElementById('sidebar-overlay').addEventListener('click', this.toggleSidebar.bind(this));
                document.querySelectorAll('#sidebar nav a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.navigate(link.dataset.page);
                        if (window.innerWidth < 1024) this.toggleSidebar();
                    });
                });
            },
            async logActivity(message) {
                 if (!this.state.currentUser) return;
                const { error } = await supabase.from('activity_log').insert({
                    user_id: this.state.currentUser.id,
                    user_name: this.state.currentUser.full_name,
                    user_role: this.state.currentUser.role,
                    action: message,
                });
                if (error) console.error('Error logging activity:', error);
            },
            
            // --- AUTHENTICATION & NAVIGATION ---
            async handleLogin(e) {
                e.preventDefault();
                // console.log('Percobaan login dimulai...'); // <-- LOG DIHAPUS
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role-select').value;
                
                // console.log(`Mencoba login sebagai: ${email} dengan peran ${role}`); // <-- LOG DIHAPUS

                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    // console.error('Supabase Auth Error:', error.message); // <-- LOG DIHAPUS
                    document.getElementById('login-error').textContent = error.message;
                    document.getElementById('login-error').classList.remove('hidden');
                    return;
                }

                // console.log('Login (Autentikasi) sukses, mengecek profil...', data); // <-- LOG DIHAPUS

                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (profileError || !profile || profile.role !== role) { // <-- PERBAIKAN: Ditambah cek '!profile'
                    // console.error('Profile Error atau Role Mismatch.', profileError, profile); // <-- LOG DIHAPUS
                    await supabase.auth.signOut();
                    document.getElementById('login-error').textContent = 'Peran yang dipilih tidak sesuai dengan akun Anda.';
                    document.getElementById('login-error').classList.remove('hidden');
                } else {
                    document.getElementById('login-error').classList.add('hidden');
                    this.logActivity('Logged in');
                }
            },
            async handleLogout() {
                try {
                    await this.logActivity('Logged out');
                    this.clearCache();
                } catch (error) {
                    console.error("Error during pre-logout cleanup:", error);
                } finally {
                    await supabase.auth.signOut();
                }
            },

            setupDashboard() {
                const user = this.state.currentUser;
                if (!user) return;

                document.getElementById('user-greeting').textContent = `Halo, ${user.full_name || 'Pengguna'}!`;
                document.getElementById('user-avatar').textContent = (user.full_name || 'P').charAt(0);
                
                const adminMenu = document.getElementById('admin-menu');
                if (user.role === 'admin') {
                    adminMenu.classList.remove('hidden');
                } else {
                    adminMenu.classList.add('hidden');
                }

                // The logout listener is now handled by event delegation in init(), so we remove it from here.

                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove('-translate-x-full');
                    mainContent.classList.add('lg:ml-64');
                }
            },
            navigate(page) {
                this.state.currentPage = page;
                const pageTitles = {
                    home: 'Beranda',
                    belajar: 'Belajar Yuk',
                    uji: 'Uji Aja',
                    'ask-admin': 'Ask Admin',
                    panduan: 'Tata Cara Penggunaan',
                    profil: 'Profil Pengguna',
                    'user-management': 'Manajemen Pengguna',
                    'activity-log': 'Log Aktivitas'
                };
                document.getElementById('page-title').textContent = pageTitles[page] || 'Beranda';
                this.renderPage();
            },
            async renderPage() {
                const container = document.getElementById('page-container');
                const page = this.state.currentPage;

                if (this.state.pageCache[page]) {
                    container.innerHTML = this.state.pageCache[page];
                    if (page === 'belajar') this.attachBelajarListeners();
                    if (page === 'uji') this.attachUjiListeners(); // <-- PERBAIKAN: Baris ini ditambahkan
                    lucide.createIcons();
                    container.classList.add('fade-in');
                    return;
                }
                
                container.innerHTML = `<div class="flex justify-center items-center h-64"><div class="loader"></div></div>`;
                
                try {
                    let content = '';
                    switch(page) {
                        case 'home': content = await this.renderHomePage(); break;
                        case 'belajar': content = await this.renderBelajarPage(); break;
                        case 'uji': content = await this.renderUjiPage(); break;
                        case 'ask-admin': content = this.renderAskAdminPage(); break;
                        case 'panduan': content = this.renderPanduanPage(); break;
                        case 'profil': content = this.renderProfilPage(); break;
                        case 'user-management': if (this.state.currentUser.role === 'admin') content = await this.renderUserManagementPage(); break;
                        case 'activity-log': if (this.state.currentUser.role === 'admin') content = await this.renderActivityLogPage(); break;
                        default: content = await this.renderHomePage();
                    }
                    
                    this.state.pageCache[page] = content;
                    container.innerHTML = content;

                    if (page === 'belajar') this.attachBelajarListeners();
                    if (page === 'uji') this.attachUjiListeners();
                    
                } catch (error) {
                    console.error('Error rendering page:', error);
                    container.innerHTML = `<div class="card text-red-500"><h3 class="font-bold">Oops! Terjadi Kesalahan</h3><p>${error.message}</p></div>`;
                } finally {
                    container.classList.add('fade-in');
                    lucide.createIcons();
                }
            },
             toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');
                const overlay = document.getElementById('sidebar-overlay');

                sidebar.classList.toggle('-translate-x-full');

                if (window.innerWidth < 1024) {
                    overlay.classList.toggle('hidden');
                } else {
                    mainContent.classList.toggle('lg:ml-64');
                }
            },

            // --- PAGE RENDERERS ---
            async renderHomePage() {
                const user = this.state.currentUser;
                let statsHtml = '';
                if (user.role === 'admin') {
                    const { count: userCount } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
                    statsHtml = `<div class="card"><h3 class="font-bold text-xl">${userCount || 0}</h3><p class="text-text-secondary">Total Pengguna</p></div>`;
                }
                
                return `
                    <div class="space-y-6">
                        <div class="card bg-primary text-white">
                            <h2 class="font-poppins text-2xl font-bold">Selamat Datang Kembali, ${user.full_name}!</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${statsHtml}</div>
                        ${user.role === 'admin' ? await this.renderAdminDashboard() : ''}
                    </div>
                `;
            },
            async renderAdminDashboard() {
                 const { data: recentUsers } = await supabase.from('profiles').select('*').order('created_at', { ascending: false }).limit(5);
                 return `
                    <div class="card">
                        <div class="flex justify-between items-center mb-4">
                             <h3 class="font-poppins font-bold text-xl">Manajemen Pengguna</h3>
                             <button class="btn btn-primary" onclick="App.showUserForm()"><i data-lucide="user-plus" class="inline-block mr-2"></i>Tambah Pengguna</button>
                        </div>
                         <ul class="space-y-2">
                            ${(recentUsers || []).map(u => `<li class="p-2 bg-background rounded-lg">${u.full_name} (${u.role})</li>`).join('')}
                         </ul>
                    </div>`;
            },
            renderMaterialCard(m) {
                const user = this.state.currentUser;
                const canEdit = user.role === 'admin' || user.role === 'guru';
                return `
                    <div id="materi-${m.id}" class="card cursor-pointer" onclick="App.viewMateri(${m.id})">
                        <h3 class="font-poppins font-bold text-xl">${m.title}</h3>
                        <p class="text-sm text-text-secondary mt-1">Oleh: ${m.author_name}</p>
                        <span class="text-xs font-bold uppercase px-2 py-1 rounded-full ${
                            m.type === 'video' ? 'bg-red-100 text-red-800' :
                            m.type === 'pdf' ? 'bg-blue-100 text-blue-800' :
                            m.type === 'foto' ? 'bg-yellow-100 text-yellow-800' :
                            'bg-green-100 text-green-800'
                        }">${m.type}</span>
                        ${ (user.role === 'admin' || (canEdit && user.id === m.author_id)) ? `
                            <div class="mt-4 pt-4 border-t flex space-x-2">
                                <button class="text-sm text-blue-600 hover:underline" onclick="event.stopPropagation(); App.editMateri(${m.id})">Edit</button>
                                <button class="text-sm text-red-600 hover:underline" onclick="event.stopPropagation(); App.confirmDeleteMateri(${m.id})">Hapus</button>
                            </div>` : ''}
                    </div>`;
            },
            async renderBelajarPage() {
                const user = this.state.currentUser;
                const canEdit = user.role === 'admin' || user.role === 'guru';
                let actionButton = canEdit ? `<button id="add-materi-btn" class="btn btn-primary"><i data-lucide="plus" class="inline-block mr-2"></i>Tambah Materi</button>` : '';

                const { data: materials, error } = await supabase.from('materials').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                const materiListHtml = (materials || []).map(this.renderMaterialCard.bind(this)).join('');

                return `
                    <div class="flex justify-between items-center mb-6">${actionButton}</div>
                    <div id="materi-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${materiListHtml || '<p id="no-materi-placeholder">Belum ada materi.</p>'}</div>`;
            },
            renderProfilPage() {
                const user = this.state.currentUser;

                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;

                return (match && match[2].length === 11) ? match[2] : null;

            async handleSaveQuestion(quizId) {
                const text = document.getElementById('q-text').value;
                const imageUrl = document.getElementById('q-image-url').value; 
                const optA = document.getElementById('q-opt-a').value;
                const optB = document.getElementById('q-opt-b').value;
                const optC = document.getElementById('q-opt-c').value;
                const optD = document.getElementById('q-opt-d').value;
                const correct = document.getElementById('q-correct').value;

                if (!text || !optA || !optB || !correct) {
                    alert("Pertanyaan, Pilihan A, Pilihan B, dan Jawaban Benar wajib diisi.");
                    return;
                }

                const options = JSON.stringify({ A: optA, B: optB, C: optC, D: optD });

                try {
                    // --- PERBAIKAN DIMULAI DI SINI ---
                    
                    // 1. Ubah 'insert' agar 'select()' data baru
                    const { data: newQuestion, error } = await supabase.from('questions').insert({
                        quiz_id: quizId,
                        question_text: text,
                        image_url: imageUrl || null, 
                        options: options,
                        correct_answer: correct,
                        type: 'multiple_choice'
                    }).select().single(); // <--- TAMBAHKAN .select().single()
                    
                    if (error) throw error;
                    
                    // 2. JANGAN panggil this.viewQuizDetails(quizId);

                        noQuestionEl.remove();
                    }

                    // Buat elemen <li> baru
                    const newQuestionHtml = `
                        <li id="question-${newQuestion.id}" class="flex justify-between items-center p-2 bg-background rounded-lg text-sm fade-in">
                            <span class="truncate w-3/4">${newQuestion.question_text}</span>
                            <button class="btn btn-danger text-sm py-1 px-2" onclick="App.deleteQuestion(${newQuestion.id}, ${quizId})">
                                <i data-lucide="trash-2" class="h-4 w-4"></i>
                            </button>
                        </li>
                    `;
                    
                    // Tambahkan ke daftar
                    questionListEl.innerHTML += newQuestionHtml;
                    
                    // 3. Reset (kosongkan) form
                    document.getElementById('q-text').value = '';
                    document.getElementById('q-image-url').value = '';
                    document.getElementById('q-opt-a').value = '';
                    document.getElementById('q-opt-b').value = '';
                    document.getElementById('q-opt-c').value = '';
                    document.getElementById('q-opt-d').value = '';
                    document.getElementById('q-correct').value = '';
                    
                    // 4. Jalankan Lucide untuk ikon baru
                    lucide.createIcons();

                    // --- PERBAIKAN SELESAI ---

                } catch (error) {
                    alert("Gagal menyimpan soal: " + error.message);
                }

            },

            async viewQuizResults(quizId) {
                const { data: quiz, error: quizError } = await supabase.from('quizzes').select('title').eq('id', quizId).single();
                if (quizError) { alert("Error: " + quizError.message); return; }

                const { data: attempts, error: attemptsError } = await supabase
                    .from('quiz_attempts')
                    .select('user_id, score, answers')
                    .eq('quiz_id', quizId);
                
                if (attemptsError) { alert("Error: " + attemptsError.message); return; }

                let resultsHtml = '<p class="text-center text-text-secondary">Belum ada yang mengerjakan kuis ini.</p>';

                if (attempts && attempts.length > 0) {
                    const userIds = attempts.map(a => a.user_id);
                    const { data: profiles, error: profilesError } = await supabase
                        .from('profiles')
                        .select('id, full_name')
                        .in('id', userIds);
                    
                    if (profilesError) { alert("Error: " + profilesError.message); return; }
                    
                    const profilesMap = new Map(profiles.map(p => [p.id, p.full_name]));
                    
                    const combinedResults = attempts.map(a => ({
                        ...a,
                        student_name: profilesMap.get(a.user_id) || 'Siswa Telah Dihapus'
                    })).sort((a, b) => b.score - a.score); // Urutkan dari nilai tertinggi

                    resultsHtml = `
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b">
                                    <th class="p-2">Nama Siswa</th>
                                    <th class="p-2">Skor</th>
                                    <th class="p-2">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${combinedResults.map(r => `
                                    <tr class="border-b border-background">
                                        <td class="p-2">${r.student_name}</td>
                                        <td class="p-2 font-bold">${r.score.toFixed(0)}</td>
                                        <td class="p-2">
                                            <button class="btn btn-outline text-xs py-1 px-2" onclick='App.viewStudentAttempt(${JSON.stringify(r.answers)}, ${JSON.stringify(quiz.title)})'>
                                                Lihat Jawaban
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
                
                const content = `
                    <h2 class="font-poppins text-2xl font-bold mb-4">Hasil Kuis: ${quiz.title}</h2>
                    <div class="max-h-96 overflow-y-auto">
                        ${resultsHtml}
                    </div>
                `;
                this.showModal(content, 'max-w-2xl');
            },

            async viewStudentAttempt(answersJson, quizTitle) {
                // answersJson bisa jadi string (dari DB) atau sudah objek (jika dari JS)
                let answers = (typeof answersJson === 'string') ? JSON.parse(answersJson) : answersJson;
                
                // Ambil semua ID soal dari jawaban
                const questionIds = Object.keys(answers).map(id => parseInt(id));
                
                // Ambil data soal dari DB
                const { data: questions, error } = await supabase.from('questions').select('*').in('id', questionIds);
                if (error) { alert("Gagal memuat detail jawaban: " + error.message); return; }

                // Buat map agar mudah dicari
                const questionsMap = new Map(questions.map(q => [q.id, q]));

                let answerDetailsHtml = questionIds.map((qId, index) => {
                    const q = questionsMap.get(qId);
                    const userAnswer = answers[qId];
                    if (!q) return `<p>Error: Soal ID ${qId} tidak ditemukan.</p>`;

                    const isCorrect = userAnswer === q.correct_answer;
                    const options = JSON.parse(q.options);

                    let optionsHtml = Object.entries(options).map(([key, value]) => {
                        let style = 'text-text-secondary';
                        if (key === q.correct_answer) style = 'text-green-600 font-bold';
                        if (key === userAnswer && !isCorrect) style = 'text-red-500 line-through';
                        
                        return `<li class="${style}"><strong>${key}.</strong> ${value}</li>`;
                    }).join('');
                    
                    return `
                        <div class="p-4 border-b">
                            <p class="font-bold">${index + 1}. ${q.question_text}</p>
                            ${q.image_url ? `<img src="${q.image_url}" class="max-w-xs my-2 rounded-lg">` : ''}
                            <ul class="my-2 space-y-1">${optionsHtml}</ul>
                            <p class="text-sm mt-2">Jawaban Siswa: <span class="font-bold ${isCorrect ? 'text-green-600' : 'text-red-500'}">${userAnswer || 'Tidak Dijawab'}</span></p>
                        </div>
                    `;
                }).join('');

                const content = `
                    <h2 class="font-poppins text-2xl font-bold mb-4">Detail Jawaban</h2>
                    <p class="text-text-secondary mb-4">Kuis: ${quizTitle}</p>
                    <div class="max-h-96 overflow-y-auto bg-background rounded-lg">
                        ${answerDetailsHtml}
                    </div>
                `;
                this.showModal(content, 'max-w-2xl');
            },
            
            // --- AKHIR FUNGSI MANAJEMEN KUIS ---

            // --- AWAL DARI FUNGSI 'UJI AJA' YANG SUDAH ADA ---
            // (confirmDeleteQuiz, renderCurrentQuizQuestion, dst. ada di bawah sini)
            
            confirmDeleteQuiz(quizId) {
                // Fungsi ini dipanggil oleh tombol Hapus di kartu kuis
                const content = `
                    <h2 class="font-poppins text-xl font-bold mb-4">Konfirmasi Hapus</h2>
                    <p>Anda yakin ingin menghapus kuis ini? Semua soal di dalamnya juga akan terhapus.</p>
                    <div class="flex justify-end space-x-2 mt-6">
                        <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                        <button class="btn btn-danger" onclick="App.performDeleteQuiz(${quizId})">Ya, Hapus</button>
                    </div>`;
                this.showModal(content);
            },

            async performDeleteQuiz(quizId) {
                // Fungsi ini melakukan penghapusan kuis
                const card = document.getElementById(`quiz-${quizId}`);
                if (card) {
                    card.classList.add('fade-out-smooth');
                    setTimeout(() => card.remove(), 500);
                }
                this.closeModal();

                try {
                    // Menghapus kuis (database akan mengurus penghapusan soal terkait)
                    const { error } = await supabase.from('quizzes').delete().eq('id', quizId);
                    if (error) throw error;
                    
                    await this.logActivity(`Menghapus kuis ID: ${quizId}`);
                    this.clearCache(['uji']);
                    
                } catch (error) {
                    alert('Gagal menghapus kuis dari server: ' + error.message);
                    this.clearCache(['uji']);
                    this.renderPage(); // Muat ulang halaman jika gagal
                }
            },
            
            // --- AKHIR PERBAIKAN ---

            // FUNGSI INI HILANG DAN DITAMBAHKAN KEMBALI
            renderCurrentQuizQuestion() {
                const { quizData, questions, currentIndex, userAnswers } = this.state.currentQuiz;
                const q = questions[currentIndex];
                const progress = ((currentIndex + 1) / questions.length) * 100;
                
                // Parse Opsi
                const options = JSON.parse(q.options);
                let optionsHtml = '';
                for (const [key, value] of Object.entries(options)) {
                    if (value) { // Hanya tampilkan pilihan yang tidak kosong
                        const isChecked = userAnswers[currentIndex] === key;
                        // Tambahkan 'has-[:checked]:' untuk style saat dipilih
                        optionsHtml += `
                            <label class="block p-3 rounded-lg border border-secondary hover:bg-gray-100 cursor-pointer has-[:checked]:bg-primary has-[:checked]:text-white transition-colors duration-200">
                                <input type="radio" name="q_option" value="${key}" class="mr-2" ${isChecked ? 'checked' : ''} onclick="App.quizSaveCurrentAnswer()">
                                ${key}. ${value}
                            </label>`;
                    }
                }

                const content = `
                    <h2 class="font-poppins text-3xl font-bold mb-2">${quizData.title}</h2>
                    <p class="text-text-secondary mb-4">Soal ${currentIndex + 1} dari ${questions.length}</p>
                    
                    <!-- Progress Bar -->
                    <div class="w-full bg-background rounded-full h-2.5 mb-6 shadow-inner">
                        <div class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                    </div>

                    <!-- Konten Soal -->
                    <div class="mb-6 min-h-[200px]">
                        <!-- KODE RUSAK (BARIS 666) SEHARUSNYA DI SINI --> <!-- <== Ini hanya komentar, aman -->
                        <p class="font-bold text-lg mb-4">${q.question_text}</p>
                        
                        <!-- AWAL PERBAIKAN FOTO: Menampilkan gambar di kuis siswa -->
                        ${q.image_url ? `<img src="${q.image_url}" alt="Gambar Soal" class="max-w-md mx-auto rounded-lg shadow-md mb-4">` : ''}
                        <!-- AKHIR PERBAIKAN FOTO -->
                        
                        <div class="space-y-2">${optionsHtml}</div>
                    </div>

                    <!-- Navigasi -->
                    <div class="flex justify-between items-center border-t pt-4 mt-6">
                        <button class="btn btn-outline" ${currentIndex === 0 ? 'disabled' : ''} onclick="App.quizPrev()">
                            <i data-lucide="arrow-left" class="inline-block mr-2 h-4 w-4"></i> Sebelumnya
                        </button>
                        ${currentIndex === questions.length - 1 ? `
                            <button class="btn btn-primary bg-green-600 hover:bg-green-700" onclick="App.confirmSubmitQuiz()">
                                <i data-lucide="check-circle" class="inline-block mr-2 h-4 w-4"></i> Selesai
                            </button>
                        ` : `
                            <button class="btn btn-primary" onclick="App.quizNext()">
                                Selanjutnya <i data-lucide="arrow-right" class="inline-block ml-2 h-4 w-4"></i>
                            </button>
                        `}
                    </div>
                `;
                this.showModal(content, 'max-w-3xl');
                lucide.createIcons();
            },

            // FUNGSI BARU: Menyimpan jawaban saat ini ke state
            quizSaveCurrentAnswer() {
                const selectedOption = document.querySelector('input[name="q_option"]:checked');
                if (selectedOption) {
                    this.state.currentQuiz.userAnswers[this.state.currentQuiz.currentIndex] = selectedOption.value;
                }
            },

            // FUNGSI BARU: Pindah ke soal berikutnya
            quizNext() {
                this.quizSaveCurrentAnswer(); // Simpan dulu jawaban slide ini
                if (this.state.currentQuiz.currentIndex < this.state.currentQuiz.questions.length - 1) {
                    this.state.currentQuiz.currentIndex++;
                    this.renderCurrentQuizQuestion(); // Tampilkan slide berikutnya
                }
            },

            // FUNGSI BARU: Pindah ke soal sebelumnya
            quizPrev() {
                this.quizSaveCurrentAnswer(); // Simpan dulu jawaban slide ini
                if (this.state.currentQuiz.currentIndex > 0) {
                    this.state.currentQuiz.currentIndex--;
                    this.renderCurrentQuizQuestion(); // Tampilkan slide sebelumnya
                }
            },
            
            // FUNGSI BARU: Tampilkan modal konfirmasi
            confirmSubmitQuiz() {
                this.quizSaveCurrentAnswer(); // Simpan jawaban terakhir
                
                const content = `
                    <h2 class="font-poppins text-2xl font-bold mb-4 text-center">Konfirmasi</h2>
                    <p class="text-center text-text-secondary mb-6">Sudah yakin dengan jawabannya?</p>
                    <div class="flex justify-center space-x-4">
                        <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                        <button class="btn btn-primary" onclick="App.submitQuiz()">Ya, Kirim!</button>
                    </div>
                `;
                this.showModal(content);
            },

            // FUNGSI LAMA (loadAndShowQuiz) DI-UPDATE TOTAL
            async loadAndShowQuiz(quizId) {
                // Tampilkan loader di modal selagi memuat
                this.showModal(`<div class="flex justify-center items-center h-48"><div class="loader"></div></div>`, 'max-w-3xl');

                const { data: quiz, error: quizError } = await supabase.from('quizzes').select('*').eq('id', quizId).single();
                const { data: questions, error: qError } = await supabase.from('questions').select('*').eq('quiz_id', quizId).order('created_at');

                if (qError || !questions || questions.length === 0) {
                    const errorContent = `
                        <h2 class="font-poppins text-2xl font-bold mb-4 text-center">Oops! Kuis Kosong</h2>
                        <p class="text-center">Kuis ini belum memiliki soal atau tidak dapat dimuat saat ini.</p>
                        <p class="text-center text-sm text-text-secondary mt-2">Silakan hubungi guru atau admin Anda.</p>
                        <button class="btn btn-primary w-full mt-6" onclick="App.closeModal()">Mengerti</button>
                    `;
                    this.showModal(errorContent);
                    return;
                }

                // --- LOGIKA BARU UNTUK SLIDE ---
                // Reset state kuis
                this.state.currentQuiz = {
                    quizData: quiz,
                    questions: questions,
                    userAnswers: new Array(questions.length).fill(null), // Array kosong untuk jawaban
                    currentIndex: 0
                };
                
                // Tampilkan soal pertama (slide pertama)
                this.renderCurrentQuizQuestion();
            },

            // FUNGSI LAMA (submitQuiz) DI-UPDATE TOTAL
            async submitQuiz() {
                // Tampilkan modal loading
                this.showModal(`<div class="flex flex-col justify-center items-center h-48"><div class="loader"></div><p class="mt-4">Menghitung nilai...</p></div>`);

                const { quizData, questions, userAnswers } = this.state.currentQuiz;
                const totalQuestions = questions.length;
                
                // Ambil jawaban benar dari state (lebih cepat)
                let score = 0;
                for (let i = 0; i < totalQuestions; i++) {
                    if (userAnswers[i] === questions[i].correct_answer) {
                        score++;
                    }
                }
                
                const finalScore = (score / totalQuestions) * 100;
                
                // Buat objek jawaban untuk disimpan
                const answersToSave = {};
                questions.forEach((q, i) => {
                    answersToSave[q.id] = userAnswers[i] || "Tidak Dijawab";
                });

                // Simpan hasil
                const { error: attemptError } = await supabase.from('quiz_attempts').insert({
                    quiz_id: quizData.id,
                    user_id: this.state.currentUser.id,
                    score: finalScore,
                    answers: JSON.stringify(answersToSave)
                });
                
                if (attemptError) {
                    alert('Gagal menyimpan hasil: ' + attemptError.message);
                    this.closeModal();
                    return;
                }
                
                // Tampilkan hasil
                const resultHtml = `
                    <h2 class="font-poppins text-2xl font-bold mb-4 text-center">Hasil Kuis</h2>
                    <p class="text-center text-6xl font-bold ${finalScore >= 70 ? 'text-green-600' : 'text-red-600'}">${finalScore.toFixed(0)}</p>
                    <p class="text-center text-text-secondary text-lg">Skor Anda</p>
                    <p class="text-center mt-4 text-lg">Anda menjawab <strong>${score}</strong> dari <strong>${totalQuestions}</strong> soal dengan benar.</p>
                    <button class="btn btn-primary w-full mt-6" onclick="App.closeModal(); App.clearCache(['uji']); App.navigate('uji');">Tutup</button>
                `;
                this.showModal(resultHtml);

                // Perbarui halaman uji aja di background
                this.clearCache(['uji']);
            },

            // --- PEROMBAKAN BESAR SELESAI ---


            // --- UTILITY METHODS ---
            showModal(content, maxWidthClass = 'max-w-lg') {
                const modalContainer = document.getElementById('modal-container');
                const modalContentEl = document.getElementById('modal-content');
                modalContentEl.className = `bg-surface rounded-xl shadow-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative fade-in ${maxWidthClass}`;
                modalContentEl.innerHTML = `<button onclick="App.closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800"><i data-lucide="x"></i></button>${content}`;
                modalContainer.classList.remove('hidden');
                modalContainer.classList.add('flex');
                lucide.createIcons();
            },
            closeModal() { document.getElementById('modal-container').classList.add('hidden'); },
            clearCache(pages = []) {
                if (pages.length === 0) {
                    this.state.pageCache = {};
                } else {
                    pages.forEach(page => delete this.state.pageCache[page]);
                }
            },

            // --- PLACEHOLDERS / BASIC IMPLEMENTATIONS ---
            async renderUserManagementPage() { return `<div class="card">Fitur Manajemen User sedang dalam pengembangan.</div>`; },
            async renderActivityLogPage() { return `<div class="card">Fitur Log Aktivitas sedang dalam pengembangan.</div>`; },
            renderAskAdminPage() { return `<div class="card">Fitur Ask Admin sedang dalam pengembangan.</div>`; },
            renderPanduanPage() { return `<div class="card prose max-w-none"><h2>Tata Cara Penggunaan</h2><p>Panduan lengkap akan segera tersedia.</p></div>`; },
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
